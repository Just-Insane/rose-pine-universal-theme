name: Browser regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:syntax
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
